<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pixel Hero Saga: SafeArea Edition</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #000; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; user-select: none; }
        
        #game-wrapper { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; background: #111; }
        
        /* 縦画面時のデフォルト。Canvasを SafeArea 内中央に配置 */
        canvas { 
            background: #4facfe; 
            width: 100vw; 
            height: auto; 
            max-height: 70vh; /* 縦幅制限 */
            image-rendering: pixelated; 
            display: block; 
            margin: 0 auto; 
            object-fit: contain; /* アスペクト比を保って SafeArea 内に配置 */
        }

        /* --- コントローラー基本設定 --- */
        .controls { 
            position: relative; 
            width: 100%; 
            flex-grow: 1; 
            background: #222; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 40px; 
            z-index: 10; 
            /* 縦画面時も SafeArea 下部を考慮 */
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        /* --- 修正の要：横画面レイアウトと SafeArea 対応 --- */
        @media (orientation: landscape) {
            canvas { 
                max-height: 100vh; /* 縦幅一杯 */
                max-width: 100vw;
                width: auto; 
                aspect-ratio: 16 / 9; 
                /* SafeArea内に配置 */
                position: relative; 
                left: 0; top: 0; 
            }
            .controls { 
                position: fixed; /* 画面に固定 */
                top: 0; left: 0; width: 100%; height: 100%; 
                background: transparent !important; /* 背景を透明に */
                pointer-events: none; /* 下の要素（Canvas）にタッチを透過 */
                padding: 0;
            }
            .d-pad, .btns { pointer-events: auto; } /* ボタンだけタッチを有効に */

            /* 左側に十字キー (SafeArea考慮) */
            .d-pad { 
                position: absolute; 
                bottom: calc(10% + env(safe-area-inset-bottom)); /* 下端 SafeArea */
                left: calc(5% + env(safe-area-inset-left)); /* 左端 SafeArea */
            }
            /* 右側にABボタン (SafeArea考慮) */
            .btns { 
                position: absolute; 
                bottom: calc(10% + env(safe-area-inset-bottom)); /* 下端 SafeArea */
                right: calc(5% + env(safe-area-inset-right)); /* 右端 SafeArea */
            }
            
            /* UI情報 (ハート、テキスト) も SafeArea 内へ移動 */
            #ui-layer { 
                position: fixed; /* 画面に固定 */
                left: calc(15px + env(safe-area-inset-left)); /* 左端 SafeArea */
                top: calc(15px + env(safe-area-inset-top)); /* 上端 SafeArea */
                padding: 0;
            }
        }

        .d-pad { display: grid; grid-template-columns: repeat(3, 55px); grid-template-rows: repeat(3, 55px); gap: 5px; }
        
        /* AとBの斜め配置 */
        .btns { position: relative; width: 140px; height: 120px; }
        .btn { 
            background: #444; border: 4px solid #111; color: white; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; font-weight: bold; 
            box-shadow: 0 5px #000; transition: 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: none; background: #666; }
        
        /* --- 修正：AとBの配置入れ替え --- */
        /* B(右上・ピンク・攻撃/溜め) */
        #b-b { 
            position: absolute; 
            right: 0; 
            top: 0; 
            width: 75px; height: 75px; 
            border-radius: 50%; 
            background: #e91e63; /* ピンク */
            font-size: 26px; 
        }
        /* A(左下・緑・ジャンプ) */
        #b-a { 
            position: absolute; 
            left: 0; 
            bottom: 0; 
            width: 75px; height: 75px; 
            border-radius: 50%; 
            background: #4caf50; /* 緑 */
            font-size: 26px; 
        }
        
        .btn-dir { width: 55px; height: 55px; font-size: 24px; background: #333; }

        /* UIテキストの基本配置 */
        #ui-layer { position: absolute; top: 15px; left: 15px; color: white; text-shadow: 2px 2px #000; pointer-events: none; z-index: 20; }
        #hp-display { font-size: 24px; color: #ff5252; }
        .boss-ui { position: absolute; top: 15px; right: 15px; width: 150px; display: none; text-align: right; color: white; }
        .hp-bar { width: 100%; height: 12px; border: 2px solid #fff; background: #000; margin-top: 5px; }
        .hp-fill { width: 100%; height: 100%; background: #f00; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="hp-display">❤❤❤</div>
        <div id="stage-display" style="font-size: 14px;">STAGE 1-1</div>
        <div id="coin-display" style="font-size: 14px;">COINS: 00</div>
    </div>
    <div class="boss-ui" id="boss-ui">
        DRAGON LORD
        <div class="hp-bar"><div id="boss-hp-fill" class="hp-fill"></div></div>
    </div>

    <div class="controls">
        <div class="d-pad">
            <div></div><div class="btn btn-dir" id="b-up">▲</div><div></div>
            <div class="btn btn-dir" id="b-left">◀</div><div></div><div class="btn btn-dir" id="b-right">▶</div>
            <div></div><div class="btn btn-dir" id="b-down">▼</div><div></div>
        </div>
        <div class="btns">
            <div class="btn" id="b-b">B</div>
            <div class="btn" id="b-a">A</div>
        </div>
    </div>
</div>

<script>
/** @type {HTMLCanvasElement} */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 480; canvas.height = 270;

const TILE_SIZE = 16;
const GRAVITY = 0.22;
const JUMP_FORCE = -7.5;
const WORLD_WIDTH = 150;

let state = {
    stage: 1, section: 1, cameraX: 0, shake: 0, hitStop: 0, coins: 0,
    player: null, entities: [], particles: [], tiles: [],
    inputs: { left: false, right: false, up: false, down: false, a: false, b: false, bHold: 0 },
    boss: null
};

class Player {
    constructor() { this.w = 14; this.h = 20; this.hp = 3; this.reset(); }
    reset() { this.x = 40; this.y = 100; this.vx = 0; this.vy = 0; this.facing = 1; this.onGround = false; this.isCrouching = false; this.hipDrop = false; this.invincible = 0; this.anim = 0; }
    update() {
        if (this.invincible > 0) this.invincible--;
        let speed = (state.inputs.b && (state.inputs.left || state.inputs.right)) ? 3.8 : 2.5;
        if (state.inputs.left) { this.vx = -speed; this.facing = -1; } else if (state.inputs.right) { this.vx = speed; this.facing = 1; } else { this.vx *= 0.85; }
        if (state.inputs.a && this.onGround) { this.vy = JUMP_FORCE; this.onGround = false; }
        this.isCrouching = state.inputs.down && this.onGround;
        if (state.inputs.down && !this.onGround) { this.hipDrop = true; this.vy = 8; }
        if (this.onGround) this.hipDrop = false;
        this.vy += GRAVITY; this.x += this.vx; this.collide('x'); this.y += this.vy; this.collide('y');
        if (this.y > canvas.height + 50) this.damage(true);
        let targetCam = this.x - canvas.width/2;
        state.cameraX += (targetCam - state.cameraX) * 0.12; state.cameraX = Math.max(0, state.cameraX);
        if (this.x > (WORLD_WIDTH * TILE_SIZE) - 20) nextSection();
    }
    collide(axis) {
        state.tiles.forEach(t => {
            if (this.x < t.x + t.w && this.x + this.w > t.x && this.y < t.y + t.h && this.y + this.h > t.y) {
                if (t.type === 'coin') { state.coins++; t.removed = true; return; }
                if (axis === 'x') { this.x -= this.vx; this.vx = 0; }
                else { if (this.vy > 0) { this.y = t.y - this.h; this.vy = 0; this.onGround = true; } else { this.y = t.y + t.h; this.vy = 0; } }
            }
        });
        state.tiles = state.tiles.filter(t => !t.removed);
    }
    damage(instant = false) {
        if (this.invincible > 0 && !instant) return;
        this.hp--; state.shake = 15; state.hitStop = 8; this.invincible = 60; this.vy = -4;
        if (this.hp <= 0 || instant) { alert("RETRY?"); location.reload(); }
    }
    draw() {
        ctx.save(); if (this.invincible % 4 > 2) ctx.globalAlpha = 0.4;
        ctx.translate(this.x - state.cameraX, this.y);
        this.anim += Math.abs(this.vx) * 0.15;
        let walkY = (this.onGround && !this.isCrouching) ? Math.abs(Math.sin(this.anim))*3 : 0;
        ctx.fillStyle = "#ffdbac"; ctx.fillRect(1, this.isCrouching ? 8 : 0 - walkY, 12, 10);
        ctx.fillStyle = "#f44"; ctx.fillRect(1, this.isCrouching ? 14 : 10, 12, 10);
        ctx.fillStyle = "#000"; ctx.fillRect(this.facing === 1 ? 9 : 2, this.isCrouching ? 12 : 4 - walkY, 2, 2);
        ctx.restore();
    }
}

class Enemy {
    constructor(type, x, y) { Object.assign(this, {type, x, y, w: 16, h: 16, vx: -1.2, hp: type==='boss'?40:1, t:0}); if (type === 'boss') { this.w = 48; this.h = 48; } }
    update() {
        this.t++; if (this.type === 'mouse') { this.x += this.vx; state.tiles.forEach(t => { if (this.x < t.x+t.w && this.x+this.w > t.x && this.y < t.y+t.h && this.y+this.h > t.y) this.vx *= -1; }); }
        else if (this.type === 'bat') { this.x += this.vx; this.y += Math.sin(this.t * 0.08) * 1.5; }
        else if (this.type === 'boss' || this.type === 'dragon') { if (this.t % 120 === 0) spawnBullet(this.x, this.y+10, -2.5, "#ff0"); }
        let p = state.player;
        if (p.x < this.x + this.w && p.x + p.w > this.x && p.y < this.y + this.h && p.y + p.h > this.y) {
            if (p.vy > 0 && p.y < this.y || p.hipDrop) { this.hp--; p.vy = -6; if (this.hp <= 0) this.dead = true; } else { p.damage(); }
        }
    }
    draw() { ctx.fillStyle = this.type==='mouse'?'#888':(this.type==='bat'?'#606':'#080'); ctx.fillRect(this.x-state.cameraX, this.y, this.w, this.h); }
}

class Bullet {
    constructor(x, y, vx, color) { Object.assign(this, {x, y, vx, color, w:10, h:10, life:120}); }
    update() {
        this.x += this.vx; this.life--;
        state.entities.forEach(e => { if (e instanceof Enemy && this.color === "#0ff" && this.x < e.x+e.w && this.x+this.w > e.x && this.y < e.y+e.h && this.y+this.h > e.y) { e.hp--; this.dead = true; } });
        let p = state.player; if (this.color === "#ff0" && this.x < p.x+p.w && this.x+this.w > p.x && this.y < p.y+p.h && this.y+p.h > p.y) { p.damage(); this.dead = true; }
    }
    draw() { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x-state.cameraX+5, this.y+5, 5, 0, 7); ctx.fill(); }
}

function spawnBullet(x, y, vx, color) { state.entities.push(new Bullet(x, y, vx, color)); }

function generateLevel() {
    state.tiles = []; state.entities = []; state.cameraX = 0;
    for(let i=0; i<WORLD_WIDTH; i++) {
        if (i > 15 && i % 14 === 0 && Math.random() > 0.4) continue;
        state.tiles.push({x: i*TILE_SIZE, y: 220, w: TILE_SIZE, h: 50, type: 'block'});
        if (i % 7 === 0) {
            state.tiles.push({x: i*TILE_SIZE, y: 155, w: 32, h: 8, type: 'block'});
            state.tiles.push({x: i*TILE_SIZE + 8, y: 135, w: 8, h: 8, type: 'coin'});
        }
        if (i > 20 && i % 18 === 0) state.entities.push(new Enemy(state.stage < 3 ? 'mouse' : 'bat', i*TILE_SIZE, 100));
    }
    if (state.stage === 5 && state.section === 5) { state.boss = new Enemy('boss', 600, 100); state.entities.push(state.boss); document.getElementById('boss-ui').style.display = 'block'; }
    state.player.reset();
}

function nextSection() { state.section++; if (state.section > 5) { state.section = 1; state.stage++; } if (state.stage > 5) { alert("ALL CLEAR!"); location.reload(); } generateLevel(); }

function mainLoop() {
    if (state.hitStop > 0) { state.hitStop--; requestAnimationFrame(mainLoop); return; }
    ctx.save();
    if (state.shake > 0) { ctx.translate((Math.random()-0.5)*state.shake, (Math.random()-0.5)*state.shake); state.shake *= 0.8; }
    ctx.fillStyle = "#4facfe"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    state.player.update();
    state.entities.forEach((e, i) => { e.update(); e.draw(); if (e.dead || (e instanceof Bullet && e.life < 0)) state.entities.splice(i, 1); if (e === state.boss && e.dead) nextSection(); });
    state.tiles.forEach(t => { ctx.fillStyle = t.type === 'block' ? '#388e3c' : '#ffd700'; ctx.fillRect(t.x - state.cameraX, t.y, t.w, t.h); });
    state.player.draw();
    ctx.restore();
    document.getElementById('hp-display').innerText = "❤".repeat(state.player.hp);
    document.getElementById('stage-display').innerText = `STAGE ${state.stage}-${state.section}`;
    if (state.boss) document.getElementById('boss-hp-fill').style.width = (state.boss.hp/40*100) + "%";
    requestAnimationFrame(mainLoop);
}

const setupBtn = (id, key) => {
    const el = document.getElementById(id);
    const start = (e) => { e.preventDefault(); state.inputs[key] = true; };
    const end = (e) => { 
        e.preventDefault(); 
        if (key === 'b' && state.inputs.bHold < 15) spawnBullet(state.player.x+10, state.player.y+5, state.player.facing*6, "#0ff");
        state.inputs[key] = false; state.inputs.bHold = 0; 
    };
    el.addEventListener('touchstart', start); el.addEventListener('touchend', end);
    el.addEventListener('mousedown', start); el.addEventListener('mouseup', end);
};
['up','down','left','right','a','b'].forEach(k => setupBtn('b-'+k, k));
setInterval(() => { if (state.inputs.b) state.inputs.bHold++; }, 20);

state.player = new Player();
generateLevel();
mainLoop();
</script>
</body>
</html>
