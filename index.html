<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pixel Hero Saga: Small UI Edition</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #000; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; user-select: none; width: 100vw; height: 100vh; }
        
        #game-wrapper { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; background: #111; }
        
        canvas { 
            background: #4facfe; 
            width: 100vw; 
            height: auto; 
            max-height: 70vh; 
            image-rendering: pixelated; 
            display: block; 
            margin: 0 auto; 
        }

        /* --- コントローラー層 --- */
        .controls { 
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        .d-pad, .btns { 
            position: absolute;
            pointer-events: auto;
        }

        /* --- 横画面（Landscape）配置 --- */
        @media (orientation: landscape) {
            canvas { max-height: 100vh; width: auto; aspect-ratio: 16 / 9; }
            .d-pad { 
                bottom: calc(10% + env(safe-area-inset-bottom));
                left: calc(5% + env(safe-area-inset-left));
            }
            .btns { 
                bottom: calc(10% + env(safe-area-inset-bottom));
                right: calc(5% + env(safe-area-inset-right));
                width: 80px; height: 70px; /* 半分に縮小 */
            }
        }

        /* --- 縦画面（Portrait）配置：ボタン位置を調整 --- */
        @media (orientation: portrait) {
            .d-pad { bottom: 130px; left: 20px; }
            .btns { bottom: 130px; right: 20px; width: 80px; height: 70px; } /* 半分に縮小 */
        }

        /* 十字キー：各ボタン30px */
        .d-pad { display: grid; grid-template-columns: repeat(3, 30px); grid-template-rows: repeat(3, 30px); gap: 3px; }
        .btn { 
            background: #444; border: 2px solid #111; color: white; border-radius: 6px; 
            display: flex; align-items: center; justify-content: center; font-weight: bold; 
            box-shadow: 0 3px #000;
        }
        .btn:active { transform: translateY(2px); box-shadow: none; background: #666; }
        .btn-dir { width: 30px; height: 30px; font-size: 12px; background: #333; }

        /* --- Aボタン（左上：ジャンプ） 40px --- */
        #b-a { 
            position: absolute; 
            left: 0; top: 0; 
            width: 40px; height: 40px; 
            border-radius: 50%; 
            background: #4caf50; 
            font-size: 14px; 
        }

        /* --- Bボタン（右下：攻撃＆ダッシュ） 40px --- */
        #b-b { 
            position: absolute; 
            right: 0; bottom: 0; 
            width: 40px; height: 40px; 
            border-radius: 50%; 
            background: #e91e63; 
            font-size: 14px; 
        }

        #ui-layer { 
            position: fixed; 
            top: calc(10px + env(safe-area-inset-top)); 
            left: calc(15px + env(safe-area-inset-left)); 
            color: white; text-shadow: 2px 2px #000; pointer-events: none; z-index: 110; 
        }
        #hp-display { font-size: 20px; color: #ff5252; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="hp-display">❤❤❤</div>
        <div id="stage-display" style="font-size: 12px;">STAGE 1-1</div>
        <div id="coin-display" style="font-size: 12px;">COINS: 00</div>
    </div>

    <div class="controls">
        <div class="d-pad">
            <div></div><div class="btn btn-dir" id="b-up">▲</div><div></div>
            <div class="btn btn-dir" id="b-left">◀</div><div></div><div class="btn btn-dir" id="b-right">▶</div>
            <div></div><div class="btn btn-dir" id="b-down">▼</div><div></div>
        </div>
        <div class="btns">
            <div class="btn" id="b-a">A</div>
            <div class="btn" id="b-b">B</div>
        </div>
    </div>
</div>

<script>
// --- ゲームロジック ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 480; canvas.height = 270;

const TILE_SIZE = 16;
const GRAVITY = 0.22;
const JUMP_FORCE = -7.5;
const WORLD_WIDTH = 150;

let state = {
    stage: 1, section: 1, cameraX: 0, coins: 0,
    player: null, entities: [], tiles: [],
    inputs: { left: false, right: false, up: false, down: false, a: false, b: false, bHold: 0 }
};

class Player {
    constructor() { this.w = 14; this.h = 20; this.hp = 3; this.reset(); }
    reset() { this.x = 40; this.y = 100; this.vx = 0; this.vy = 0; this.facing = 1; this.onGround = false; this.isCrouching = false; this.hipDrop = false; this.invincible = 0; }
    update() {
        if (this.invincible > 0) this.invincible--;
        let speed = state.inputs.b ? 3.8 : 2.5;
        if (state.inputs.left) { this.vx = -speed; this.facing = -1; } else if (state.inputs.right) { this.vx = speed; this.facing = 1; } else { this.vx *= 0.85; }
        if (state.inputs.a && this.onGround) { this.vy = JUMP_FORCE; this.onGround = false; }
        
        this.isCrouching = state.inputs.down && this.onGround;
        if (state.inputs.down && !this.onGround) { this.hipDrop = true; this.vy = 8; }
        if (this.onGround) this.hipDrop = false;
        this.vy += GRAVITY; this.x += this.vx; this.collide('x'); this.y += this.vy; this.collide('y');
        if (this.y > canvas.height + 50) this.damage(true);
        state.cameraX += (this.x - canvas.width/2 - state.cameraX) * 0.12;
        state.cameraX = Math.max(0, state.cameraX);
        if (this.x > (WORLD_WIDTH * TILE_SIZE) - 20) nextSection();
    }
    collide(axis) {
        state.tiles.forEach(t => {
            if (this.x < t.x + t.w && this.x + this.w > t.x && this.y < t.y + t.h && this.y + this.h > t.y) {
                if (t.type === 'coin') { state.coins++; t.removed = true; return; }
                if (axis === 'x') { this.x -= this.vx; this.vx = 0; }
                else { if (this.vy > 0) { this.y = t.y - this.h; this.vy = 0; this.onGround = true; } else { this.y = t.y + t.h; this.vy = 0; } }
            }
        });
        state.tiles = state.tiles.filter(t => !t.removed);
    }
    damage(instant = false) {
        if (this.invincible > 0 && !instant) return;
        this.hp--; this.invincible = 60; this.vy = -4;
        if (this.hp <= 0 || instant) { alert("RETRY?"); location.reload(); }
    }
    draw() {
        ctx.save(); if (this.invincible % 4 > 2) ctx.globalAlpha = 0.4;
        ctx.translate(this.x - state.cameraX, this.y);
        ctx.fillStyle = "#ffdbac"; ctx.fillRect(1, this.isCrouching ? 8 : 0, 12, 10);
        ctx.fillStyle = "#f44"; ctx.fillRect(1, this.isCrouching ? 14 : 10, 12, 10);
        ctx.fillStyle = "#000"; ctx.fillRect(this.facing === 1 ? 9 : 2, this.isCrouching ? 12 : 4, 2, 2);
        ctx.restore();
    }
}

class Enemy {
    constructor(type, x, y) { Object.assign(this, {type, x, y, w: 16, h: 16, vx: -1.2, dead: false}); }
    update() {
        this.x += this.vx;
        state.tiles.forEach(t => { if (this.x < t.x+t.w && this.x+this.w > t.x && this.y < t.y+t.h && this.y+this.h > t.y) this.vx *= -1; });
        let p = state.player;
        if (p.x < this.x + this.w && p.x + p.w > this.x && p.y < this.y + this.h && p.y + p.h > this.y) {
            if (p.vy > 0 && p.y < this.y || p.hipDrop) { this.dead = true; p.vy = -6; } else { p.damage(); }
        }
    }
    draw() { ctx.fillStyle = '#080'; ctx.fillRect(this.x-state.cameraX, this.y, this.w, this.h); }
}

class Bullet {
    constructor(x, y, vx) { Object.assign(this, {x, y, vx, w:10, h:10, life:100}); }
    update() {
        this.x += this.vx; this.life--;
        state.entities.forEach(e => { if (e instanceof Enemy && this.x < e.x+e.w && this.x+this.w > e.x && this.y < e.y+e.h && this.y+this.h > e.y) { e.dead = true; this.dead = true; } });
    }
    draw() { ctx.fillStyle = '#0ff'; ctx.beginPath(); ctx.arc(this.x-state.cameraX+5, this.y+5, 5, 0, 7); ctx.fill(); }
}

function generateLevel() {
    state.tiles = []; state.entities = []; state.cameraX = 0;
    for(let i=0; i<WORLD_WIDTH; i++) {
        if (i > 15 && i % 14 === 0 && Math.random() > 0.4) continue;
        state.tiles.push({x: i*TILE_SIZE, y: 220, w: TILE_SIZE, h: 50, type: 'block'});
        if (i % 7 === 0) state.tiles.push({x: i*TILE_SIZE, y: 155, w: 32, h: 8, type: 'block'});
        if (i > 20 && i % 18 === 0) state.entities.push(new Enemy('mouse', i*TILE_SIZE, 204));
    }
    state.player.reset();
}

function nextSection() { state.section++; if (state.section > 5) { state.section = 1; state.stage++; } if (state.stage > 5) { alert("ALL CLEAR!"); location.reload(); } generateLevel(); }

function mainLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#4facfe"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    state.player.update();
    state.entities.forEach((e, i) => { e.update(); e.draw(); if (e.dead || (e instanceof Bullet && e.life < 0)) state.entities.splice(i, 1); });
    state.tiles.forEach(t => { ctx.fillStyle = t.type === 'block' ? '#388e3c' : '#ffd700'; ctx.fillRect(t.x - state.cameraX, t.y, t.w, t.h); });
    state.player.draw();
    document.getElementById('hp-display').innerText = "❤".repeat(state.player.hp);
    document.getElementById('stage-display').innerText = `STAGE ${state.stage}-${state.section}`;
    requestAnimationFrame(mainLoop);
}

const setupBtn = (id, key) => {
    const el = document.getElementById(id);
    const start = (e) => { e.preventDefault(); state.inputs[key] = true; };
    const end = (e) => { 
        e.preventDefault(); 
        if (key === 'b' && state.inputs.bHold < 15) state.entities.push(new Bullet(state.player.x+10, state.player.y+5, state.player.facing*6));
        state.inputs[key] = false; state.inputs.bHold = 0; 
    };
    el.addEventListener('touchstart', start); el.addEventListener('touchend', end);
    el.addEventListener('mousedown', start); el.addEventListener('mouseup', end);
};
['up','down','left','right','a','b'].forEach(k => setupBtn('b-'+k, k));
setInterval(() => { if (state.inputs.b) state.inputs.bHold++; }, 20);

state.player = new Player();
generateLevel();
mainLoop();
</script>
</body>
</html>
