<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pixel Hero Master</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #000; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; user-select: none; width: 100vw; height: 100vh; }
        #game-wrapper { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; background: #000; }
        canvas { background: #000033; width: 100vw; height: auto; max-height: 70vh; image-rendering: pixelated; display: block; margin: 0 auto; }

        .controls { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 100; }
        .d-pad, .btns { position: absolute; pointer-events: auto; }

        @media (orientation: landscape) {
            canvas { max-height: 100vh; width: auto; aspect-ratio: 16 / 9; }
            .d-pad { bottom: calc(10% + env(safe-area-inset-bottom)); left: calc(8% + env(safe-area-inset-left)); }
            .btns { bottom: calc(10% + env(safe-area-inset-bottom)); right: calc(8% + env(safe-area-inset-right)); width: 130px; height: 130px; }
        }
        @media (orientation: portrait) {
            .d-pad { bottom: 130px; left: 15px; }
            .btns { bottom: 130px; right: 15px; width: 130px; height: 130px; }
        }

        .d-pad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 5px; }
        .btn { background: #444; border: 3px solid #111; color: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 4px #000; }
        .btn:active { transform: translateY(3px); box-shadow: none; background: #666; }
        .btn-dir { width: 50px; height: 50px; font-size: 20px; background: #333; }
        #b-a { position: absolute; left: 0; top: 0; width: 60px; height: 60px; border-radius: 50%; background: #4caf50; font-size: 24px; z-index: 101; }
        #b-b { position: absolute; right: 0; bottom: 0; width: 60px; height: 60px; border-radius: 50%; background: #e91e63; font-size: 24px; z-index: 101; }

        #ui-layer { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: calc(15px + env(safe-area-inset-left)); color: white; text-shadow: 2px 2px #000; pointer-events: none; z-index: 110; }
        #hp-display { font-size: 24px; color: #ff5252; }
        .boss-bar { position: fixed; top: 20px; right: 20px; width: 150px; height: 12px; border: 2px solid #fff; background: #000; display: none; overflow: hidden;}
        #boss-hp-inner { width: 100%; height: 100%; background: linear-gradient(to bottom, #ff5555, #990000); transition: width 0.3s; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
        <div id="hp-display">❤❤❤</div>
        <div id="stage-display" style="font-size: 14px;">STAGE 1-1</div>
        <div id="coin-display" style="font-size: 14px;">COINS: 00</div>
    </div>
    <div class="boss-bar" id="boss-ui"><div id="boss-hp-inner"></div></div>
    <div class="controls">
        <div class="d-pad">
            <div></div><div class="btn btn-dir" id="b-up">▲</div><div></div>
            <div class="btn btn-dir" id="b-left">◀</div><div></div><div class="btn btn-dir" id="b-right">▶</div>
            <div></div><div class="btn btn-dir" id="b-down">▼</div><div></div>
        </div>
        <div class="btns"><div class="btn" id="b-a">A</div><div class="btn" id="b-b">B</div></div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 480; canvas.height = 270;
ctx.imageSmoothingEnabled = false;

const TILE_SIZE = 16;
const GRAVITY = 0.22;
const JUMP_FORCE = -7.5;
const WORLD_END = 3000;

let state = {
    stage: 1, section: 1, cameraX: 0, coins: 0,
    player: null, entities: [], particles: [], tiles: [],
    inputs: { left: false, right: false, up: false, down: false, a: false, b: false, bHold: 0 },
    boss: null, shake: 0
};

// --- キャラ描画 (画像リファレンス反映) ---
function drawPlayer(ctx, x, y, facing, isCrouching, onGround, anim) {
    ctx.save();
    ctx.translate(x, y);
    if (facing === -1) { ctx.translate(16, 0); ctx.scale(-1, 1); }
    let walkY = (onGround && !isCrouching) ? Math.abs(Math.sin(anim)) * 2 : 0;
    ctx.translate(0, -walkY);
    // マリオ帽
    ctx.fillStyle = "#f00"; ctx.fillRect(2, 0, 10, 4); ctx.fillRect(10, 2, 3, 2);
    // 顔
    ctx.fillStyle = "#ffdbac"; ctx.fillRect(4, 2, 8, 10);
    ctx.fillStyle = "#000"; ctx.fillRect(10, 4, 1, 2); // 目
    // 服とオーバーオール
    ctx.fillStyle = "#f00"; ctx.fillRect(2, 12, 12, 10);
    ctx.fillStyle = "#00f"; ctx.fillRect(3, 12, 3, 10); ctx.fillRect(10, 12, 3, 10); ctx.fillRect(3, 18, 10, 4);
    // 靴
    ctx.fillStyle = "#5d2e00"; ctx.fillRect(1, 22, 6, 2); ctx.fillRect(9, 22, 6, 2);
    ctx.restore();
}

function drawEnemy(ctx, x, y, type, t) {
    ctx.save(); ctx.translate(x, y);
    if (type === 'mouse') { // トゲゾー
        ctx.fillStyle = "#ff8c00"; ctx.fillRect(0, 4, 16, 12);
        ctx.fillStyle = "#fff"; ctx.fillRect(2, 0, 2, 4); ctx.fillRect(7, 0, 2, 4); ctx.fillRect(12, 0, 2, 4);
        ctx.fillStyle = "#ffdbac"; ctx.fillRect(12, 8, 4, 8);
    } else if (type === 'bat') { // ワドルドゥ/カービィ風
        let wingY = Math.sin(t * 0.2) * 4;
        ctx.fillStyle = "#606"; ctx.beginPath(); ctx.arc(8, 8+wingY, 8, 0, 7); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(8, 8+wingY, 5, 0, 7); ctx.fill();
        ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(8, 8+wingY, 2.5, 0, 7); ctx.fill();
    } else if (type === 'boss') { // 巨大龍
        ctx.fillStyle = "#0a0"; ctx.fillRect(0, 0, 64, 64);
        ctx.fillStyle = "#ffd700"; ctx.fillRect(40, 0, 24, 24); // 頭
        ctx.fillStyle = "#fff"; ctx.fillRect(50, 5, 6, 6); // 目
        ctx.fillStyle = "#f00"; if (t % 120 > 90) ctx.fillStyle = "#ff0"; ctx.fillRect(60, 15, 8, 10); // 口
    }
    ctx.restore();
}

// --- ロジッククラス ---
class Player {
    constructor() { this.w = 16; this.h = 24; this.hp = 3; this.reset(); }
    reset() { this.x = 48; this.y = 100; this.vx = 0; this.vy = 0; this.facing = 1; this.onGround = false; this.invincible = 0; this.anim = 0; }
    update() {
        if (this.invincible > 0) this.invincible--;
        // 【修正】変数名を speed に統一
        let speed = state.inputs.b ? 3.8 : 2.4;
        if (state.inputs.left) { this.vx = -speed; this.facing = -1; }
        else if (state.inputs.right) { this.vx = speed; this.facing = 1; }
        else { this.vx *= 0.85; }

        if (state.inputs.a && this.onGround) { this.vy = JUMP_FORCE; this.onGround = false; }
        
        let isCrouch = state.inputs.down && this.onGround;
        if (state.inputs.down && !this.onGround) { this.vy = 8; }

        this.vy += GRAVITY; this.x += this.vx; this.collide('x'); this.y += this.vy; this.collide('y');
        if (this.y > canvas.height + 50) this.damage(true);
        state.cameraX = Math.max(0, Math.min(this.x - canvas.width/2, WORLD_END - canvas.width));
        if (this.x > WORLD_END - 50) nextSection();
    }
    collide(axis) {
        state.tiles.forEach(t => {
            if (this.x < t.x + t.w && this.x + this.w > t.x && this.y < t.y + t.h && this.y + this.h > t.y) {
                if (axis === 'x') { this.x -= this.vx; this.vx = 0; }
                else { if (this.vy > 0) { this.y = t.y - this.h; this.vy = 0; this.onGround = true; } else { this.y = t.y + t.h; this.vy = 0; } }
            }
        });
    }
    damage(inst) {
        if (this.invincible > 0 && !inst) return;
        this.hp--; this.invincible = 60; this.vy = -4; state.shake = 10;
        if (this.hp <= 0 || inst) { alert("RETRY"); location.reload(); }
    }
    draw() {
        this.anim += Math.abs(this.vx) * 0.1;
        ctx.save(); if (this.invincible % 4 > 2) ctx.globalAlpha = 0.4;
        drawPlayer(ctx, this.x - state.cameraX, this.y, this.facing, state.inputs.down && this.onGround, this.onGround, this.anim);
        ctx.restore();
    }
}

class Enemy {
    constructor(type, x, y) { Object.assign(this, {type, x, y, w: 16, h: 16, vx: -1.2, hp: type==='boss'?50:1, t: 0, dead: false}); if(type==='boss'){this.w=64;this.h=64;this.vx=0;} }
    update() {
        this.t++;
        if (this.type === 'mouse') {
            this.x += this.vx; state.tiles.forEach(t => { if (this.x < t.x+t.w && this.x+this.w > t.x && this.y < t.y+t.h && this.y+this.h > t.y) this.vx *= -1; });
        } else if (this.type === 'bat') {
            this.x += this.vx; this.y += Math.sin(this.t * 0.1) * 1.5;
            if (this.t % 150 === 0) spawnBullet(this.x, this.y+8, -2, false);
        } else if (this.type === 'boss') {
            this.y += Math.sin(this.t * 0.05) * 1.5;
            if (this.t % 100 === 0) spawnBullet(this.x, this.y+20, -3, false);
        }
        let p = state.player;
        if (p.x < this.x + this.w && p.x + p.w > this.x && p.y < this.y + this.h && p.y + p.h > this.y) {
            if (p.vy > 0 && p.y < this.y) { if (this.type === 'mouse') p.damage(); else { this.hp--; p.vy = -6; if (this.hp <= 0) this.dead = true; } }
            else { p.damage(); }
        }
    }
}

class Bullet {
    constructor(x, y, vx, isPlayer) { Object.assign(this, {x, y, vx, isPlayer, w: 8, h: 8, life: 100, dead: false}); }
    update() {
        this.x += this.vx; this.life--;
        if (this.isPlayer) {
            state.entities.forEach(e => {
                if (e instanceof Enemy && !e.dead && this.x < e.x + e.w && this.x + this.w > e.x && this.y < e.y + e.h && this.y + this.h > e.y) {
                    e.hp--; if (e.hp <= 0) e.dead = true; this.dead = true;
                }
            });
        } else {
            let p = state.player; if (this.x < p.x + p.w && this.x + this.w > p.x && this.y < p.y + p.h && this.y + p.h > p.y) { p.damage(); this.dead = true; }
        }
    }
}

function spawnBullet(x,y,vx,isP){ state.entities.push(new Bullet(x,y,vx,isP)); }

// --- ステージ生成 ---
function generateLevel() {
    state.tiles = []; state.entities = []; state.cameraX = 0;
    for (let i = 0; i < WORLD_END / TILE_SIZE; i++) {
        state.tiles.push({x: i * TILE_SIZE, y: 224, w: TILE_SIZE, h: 50, type: 'block'}); // 岩の地面
        if (i % 15 === 0 && i > 10) {
            let et = state.stage < 3 ? 'mouse' : 'bat';
            state.entities.push(new Enemy(et, i * TILE_SIZE, 208));
        }
        if (i % 8 === 0) { // マリオのパイプ風
            state.tiles.push({x: i * TILE_SIZE, y: 160, w: 32, h: 16, type: 'pipe'});
        }
    }
    if (state.stage === 5 && state.section === 5) {
        state.boss = new Enemy('boss', 600, 100); state.entities.push(state.boss);
        document.getElementById('boss-ui').style.display = 'block';
    } else { document.getElementById('boss-ui').style.display = 'none'; }
    state.player.reset();
}

function nextSection() {
    state.section++; if (state.section > 5) { state.section = 1; state.stage++; }
    if (state.stage > 5) { alert("VICTORY!"); location.reload(); }
    generateLevel();
    document.getElementById('stage-display').innerText = `STAGE ${state.stage}-${state.section}`;
}

// --- メインループ ---
function mainLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (state.shake > 0) { ctx.translate(Math.random()*state.shake-state.shake/2, Math.random()*state.shake-state.shake/2); state.shake *= 0.9; }

    // 背景：ダークマインド風の渦巻き
    let grad = ctx.createRadialGradient(240, 135, 0, 240, 135, 300);
    grad.addColorStop(0, "#000033"); grad.addColorStop(1, "#330066");
    ctx.fillStyle = grad; ctx.fillRect(0,0,canvas.width,canvas.height);

    state.player.update();
    state.entities.forEach((e, i) => {
        e.update();
        if (e.dead || e.life < 0) state.entities.splice(i, 1);
        else if (e instanceof Enemy) drawEnemy(ctx, e.x - state.cameraX, e.y, e.type, e.t);
        else { ctx.fillStyle = e.isPlayer ? "#0ff" : "#ff0"; ctx.beginPath(); ctx.arc(e.x-state.cameraX+4, e.y+4, 4, 0, 7); ctx.fill(); }
        if (e === state.boss && e.dead) nextSection();
    });

    state.tiles.forEach(t => {
        // 岩の地面 (カービィ風)
        ctx.fillStyle = "#442200"; ctx.fillRect(t.x-state.cameraX, t.y, t.w, t.h);
        ctx.fillStyle = "#663300"; ctx.fillRect(t.x-state.cameraX, t.y, t.w, 4);
        if (t.x % 64 === 0) { ctx.fillStyle = "#ffff00"; ctx.fillRect(t.x-state.cameraX+4, t.y+8, 2, 2); } // 星
    });

    state.player.draw();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    document.getElementById('hp-display').innerText = "❤".repeat(state.player.hp);
    document.getElementById('coin-display').innerText = `COINS: ${String(state.coins).padStart(2, '0')}`;
    if (state.boss) document.getElementById('boss-hp-inner').style.width = (state.boss.hp / 50 * 100) + "%";
    requestAnimationFrame(mainLoop);
}

// --- 入力設定 (PC/Mobile対応) ---
const setupInput = (id, k) => {
    const el = document.getElementById(id);
    const start = (e) => { e.preventDefault(); state.inputs[k] = true; };
    const end = (e) => { 
        e.preventDefault(); 
        if(k==='b' && state.inputs.bHold < 15) spawnBullet(state.player.x+10, state.player.y+8, state.player.facing*6, true);
        state.inputs[k] = false; state.inputs.bHold = 0; 
    };
    el.addEventListener('touchstart', start, {passive: false}); el.addEventListener('touchend', end, {passive: false});
    el.addEventListener('mousedown', start); el.addEventListener('mouseup', end);
};
['up','down','left','right','a','b'].forEach(k => setupInput('b-'+k, k));

// キーボード対応
window.addEventListener('keydown', e => {
    if(e.key === 'ArrowLeft') state.inputs.left = true;
    if(e.key === 'ArrowRight') state.inputs.right = true;
    if(e.key === 'ArrowUp' || e.key === ' ') state.inputs.a = true;
    if(e.key === 'ArrowDown') state.inputs.down = true;
    if(e.key.toLowerCase() === 'z') state.inputs.b = true;
});
window.addEventListener('keyup', e => {
    if(e.key === 'ArrowLeft') state.inputs.left = false;
    if(e.key === 'ArrowRight') state.inputs.right = false;
    if(e.key === 'ArrowUp' || e.key === ' ') state.inputs.a = false;
    if(e.key === 'ArrowDown') state.inputs.down = false;
    if(e.key.toLowerCase() === 'z') {
        if(state.inputs.bHold < 15) spawnBullet(state.player.x+10, state.player.y+8, state.player.facing*6, true);
        state.inputs.b = false; state.inputs.bHold = 0;
    }
});

setInterval(() => { if (state.inputs.b) state.inputs.bHold++; }, 20);

state.player = new Player();
generateLevel();
mainLoop();
</script>
</body>
</html>
