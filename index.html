<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pixel Hero Saga - Final</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #000; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; user-select: none; width: 100vw; height: 100vh; }
        #game-wrapper { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; background: #111; }
        canvas { background: #4facfe; width: 100vw; height: auto; max-height: 70vh; image-rendering: pixelated; display: block; margin: 0 auto; }

        /* コントローラー配置の教訓：固定(fixed)かつSafeArea考慮 */
        .controls { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 100; }
        .d-pad, .btns { position: absolute; pointer-events: auto; }

        /* 横画面配置 */
        @media (orientation: landscape) {
            canvas { max-height: 100vh; width: auto; aspect-ratio: 16 / 9; }
            .d-pad { bottom: calc(10% + env(safe-area-inset-bottom)); left: calc(5% + env(safe-area-inset-left)); }
            .btns { bottom: calc(10% + env(safe-area-inset-bottom)); right: calc(5% + env(safe-area-inset-right)); width: 120px; height: 110px; }
        }

        /* 縦画面配置：埋まらない高さ(130px) */
        @media (orientation: portrait) {
            .d-pad { bottom: 130px; left: 15px; }
            .btns { bottom: 130px; right: 15px; width: 120px; height: 110px; }
        }

        /* 十字キー：各50px */
        .d-pad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 5px; }
        .btn { background: #444; border: 3px solid #111; color: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 4px #000; }
        .btn:active { transform: translateY(3px); box-shadow: none; background: #666; }
        .btn-dir { width: 50px; height: 50px; font-size: 20px; background: #333; }

        /* ABボタン：60px。A左上、B右下 */
        .btns { position: relative; }
        #b-a { position: absolute; left: 0; top: 0; width: 60px; height: 60px; border-radius: 50%; background: #4caf50; font-size: 22px; }
        #b-b { position: absolute; right: 0; bottom: 0; width: 60px; height: 60px; border-radius: 50%; background: #e91e63; font-size: 22px; }

        #ui-layer { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: calc(15px + env(safe-area-inset-left)); color: white; text-shadow: 2px 2px #000; pointer-events: none; z-index: 110; }
        #hp-display { font-size: 24px; color: #ff5252; }
        .boss-bar { position: fixed; top: 20px; right: 20px; width: 150px; height: 15px; border: 2px solid #fff; background: #000; display: none; }
        #boss-hp-inner { width: 100%; height: 100%; background: #f00; }
    </style>
</head>
<body>
<div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
        <div id="hp-display">❤❤❤</div>
        <div id="stage-display" style="font-size: 14px;">STAGE 1-1</div>
        <div id="coin-display" style="font-size: 14px;">COINS: 00</div>
    </div>
    <div class="boss-bar" id="boss-ui"><div id="boss-hp-inner"></div></div>
    <div class="controls">
        <div class="d-pad">
            <div></div><div class="btn btn-dir" id="b-up">▲</div><div></div>
            <div class="btn btn-dir" id="b-left">◀</div><div></div><div class="btn btn-dir" id="b-right">▶</div>
            <div></div><div class="btn btn-dir" id="b-down">▼</div><div></div>
        </div>
        <div class="btns"><div class="btn" id="b-a">A</div><div class="btn" id="b-b">B</div></div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 480; canvas.height = 270;

const TILE_SIZE = 16;
const GRAVITY = 0.22;
const JUMP_FORCE = -7.5;

let state = {
    stage: 1, section: 1, cameraX: 0, coins: 0,
    player: null, entities: [], tiles: [],
    inputs: { left: false, right: false, up: false, down: false, a: false, b: false, bHold: 0 },
    boss: null
};

class Player {
    constructor() { this.w = 16; this.h = 24; this.hp = 3; this.reset(); }
    reset() { this.x = 50; this.y = 100; this.vx = 0; this.vy = 0; this.facing = 1; this.onGround = false; this.isCrouching = false; this.hipDrop = false; this.invincible = 0; this.anim = 0; }
    update() {
        if (this.invincible > 0) this.invincible--;
        let speed = state.inputs.b ? 3.8 : 2.4; // Bでダッシュ
        if (state.inputs.left) { this.vx = -speed; this.facing = -1; } else if (state.inputs.right) { this.vx = speed; this.facing = 1; } else { this.vx *= 0.85; }
        if (state.inputs.a && this.onGround) { this.vy = JUMP_FORCE; this.onGround = false; } // Aでジャンプ
        this.isCrouching = state.inputs.down && this.onGround;
        if (state.inputs.down && !this.onGround) { this.hipDrop = true; this.vy = 8; }
        if (this.onGround) this.hipDrop = false;
        this.vy += GRAVITY; this.x += this.vx; this.collide('x'); this.y += this.vy; this.collide('y');
        if (this.y > canvas.height + 50) this.takeDamage(true);
        state.cameraX += (this.x - canvas.width/2 - state.cameraX) * 0.1;
        state.cameraX = Math.max(0, state.cameraX);
        if (this.x > 2000) nextSection(); // ステージ端
    }
    collide(axis) {
        state.tiles.forEach(t => {
            if (this.x < t.x + t.w && this.x + this.w > t.x && this.y < t.y + t.h && this.y + this.h > t.y) {
                if (t.type === 'coin') { state.coins++; t.removed = true; return; }
                if (axis === 'x') { this.x -= this.vx; this.vx = 0; }
                else { if (this.vy > 0) { this.y = t.y - this.h; this.vy = 0; this.onGround = true; } else { this.y = t.y + t.h; this.vy = 0; } }
            }
        });
        state.tiles = state.tiles.filter(t => !t.removed);
    }
    takeDamage(instant = false) {
        if (this.invincible > 0 && !instant) return;
        this.hp--; this.invincible = 60; this.vy = -4;
        if (this.hp <= 0 || instant) { alert("Game Over"); location.reload(); }
    }
    draw() {
        ctx.save(); if (this.invincible % 4 > 2) ctx.globalAlpha = 0.4;
        ctx.translate(this.x - state.cameraX, this.y);
        this.anim += Math.abs(this.vx) * 0.1;
        let walkY = this.onGround ? Math.abs(Math.sin(this.anim))*2 : 0;
        // 人型
        ctx.fillStyle = "#ffdbac"; ctx.fillRect(2, this.isCrouching?8:0-walkY, 12, 12); // 頭
        ctx.fillStyle = "#333"; ctx.fillRect(2, this.isCrouching?8:0-walkY, 12, 3); // 髪
        ctx.fillStyle = "#f44"; ctx.fillRect(2, this.isCrouching?14:12, 12, 12); // 服
        ctx.fillStyle = "#000"; ctx.fillRect(this.facing === 1 ? 10 : 4, this.isCrouching?12:4-walkY, 2, 2); // 目
        ctx.restore();
    }
}

class Enemy {
    constructor(type, x, y) { Object.assign(this, {type, x, y, w: 16, h: 16, vx: -1.2, hp: type==='boss'?50:1, t: 0}); if(type==='boss'){this.w=64;this.h=64;} }
    update() {
        this.t++;
        if (this.type === 'mouse') { // トゲネズミ：踏むと痛い
            this.x += this.vx;
            state.tiles.forEach(t => { if (this.x < t.x+t.w && this.x+this.w > t.x && this.y < t.y+t.h && this.y+this.h > t.y) this.vx *= -1; });
        } else if (this.type === 'bat') { // コウモリ：浮遊
            this.x += this.vx; this.y += Math.sin(this.t * 0.1) * 1;
            if (this.t % 150 === 0) spawnBullet(this.x, this.y+8, -2, "#0ff");
        } else if (this.type === 'boss') { // 龍
            this.y += Math.sin(this.t * 0.05) * 1.5;
            if (this.t % 100 === 0) spawnBullet(this.x, this.y+30, -3, "#ff0");
        }
        let p = state.player;
        if (p.x < this.x + this.w && p.x + p.w > this.x && p.y < this.y + this.h && p.y + p.h > this.y) {
            if (p.vy > 0 && p.y < this.y || p.hipDrop) {
                if (this.type === 'mouse') { p.takeDamage(); } 
                else { this.hp--; p.vy = -6; if (this.hp <= 0) this.dead = true; }
            } else { p.takeDamage(); }
        }
    }
    draw() {
        ctx.fillStyle = this.type==='mouse'?'#888':(this.type==='bat'?'#606':'#080');
        ctx.fillRect(this.x-state.cameraX, this.y, this.w, this.h);
        if(this.type==='mouse'){ ctx.fillStyle="#fff"; ctx.fillRect(this.x-state.cameraX+4,this.y-4,8,4); } // トゲ
    }
}

class Bullet {
    constructor(x,y,vx,c){Object.assign(this,{x,y,vx,c,w:8,h:8,life:100});}
    update(){
        this.x+=this.vx; this.life--;
        if(this.c==="#0ff"||this.c==="#00f"){ // プレイヤーの弾
            state.entities.forEach(e=>{if(e instanceof Enemy && this.x<e.x+e.w && this.x+this.w>e.x && this.y<e.y+e.h && this.y+this.h>e.y){e.hp--;this.dead=true;}});
        } else { // 敵の弾
            let p=state.player; if(this.x<p.x+p.w && this.x+this.w>p.x && this.y<p.y+p.h && this.y+this.h>p.y){p.takeDamage();this.dead=true;}
        }
    }
    draw(){ctx.fillStyle=this.c; ctx.beginPath();ctx.arc(this.x-state.cameraX+4,this.y+4,4,0,7);ctx.fill();}
}

function spawnBullet(x,y,vx,c){state.entities.push(new Bullet(x,y,vx,c));}

function nextSection() {
    state.section++; if (state.section > 5) { state.section = 1; state.stage++; }
    if (state.stage > 5) { alert("Congratulations!"); location.reload(); }
    generateLevel();
}

function generateLevel() {
    state.tiles = []; state.entities = []; state.cameraX = 0;
    const len = 150;
    for(let i=0; i<len; i++) {
        state.tiles.push({x: i*TILE_SIZE, y: 240, w: TILE_SIZE, h: 30, type: 'block'});
        if (i > 10 && i % 15 === 0) {
            let et = state.stage < 3 ? 'mouse' : 'bat';
            state.entities.push(new Enemy(et, i*TILE_SIZE, 224));
        }
        if (i % 8 === 0) state.tiles.push({x: i*TILE_SIZE, y: 160, w: 32, h: 8, type: 'block'});
    }
    if (state.stage === 5 && state.section === 5) {
        state.boss = new Enemy('boss', 500, 100); state.entities.push(state.boss);
        document.getElementById('boss-ui').style.display='block';
    } else { document.getElementById('boss-ui').style.display='none'; }
    state.player.reset();
}

function update() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // パララックス背景
    ctx.fillStyle="#5c94fc"; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#4a80e0"; for(let i=0;i<5;i++) ctx.fillRect(i*250-(state.cameraX*0.3)%250, 100, 100, 150);
    
    state.player.update();
    state.entities.forEach((e,i)=>{e.update();e.draw(); if(e.dead||e.life<0) state.entities.splice(i,1); if(e===state.boss&&e.dead) nextSection();});
    state.tiles.forEach(t=>{ctx.fillStyle="#388e3c"; ctx.fillRect(t.x-state.cameraX,t.y,t.w,t.h);});
    state.player.draw();
    
    document.getElementById('hp-display').innerText = "❤".repeat(state.player.hp);
    document.getElementById('stage-display').innerText = `STAGE ${state.stage}-${state.section}`;
    if(state.boss) document.getElementById('boss-hp-inner').style.width = (state.boss.hp/50*100)+"%";
    requestAnimationFrame(update);
}

const setup = (id, k) => {
    const el = document.getElementById(id);
    const start = (e) => { e.preventDefault(); state.inputs[k] = true; };
    const end = (e) => { 
        e.preventDefault(); 
        if(k==='b' && state.inputs.bHold < 15) spawnBullet(state.player.x+10,state.player.y+8,state.player.facing*5,"#00f");
        state.inputs[k] = false; state.inputs.bHold = 0; 
    };
    el.addEventListener('touchstart', start); el.addEventListener('touchend', end);
    el.addEventListener('mousedown', start); el.addEventListener('mouseup', end);
};
['up','down','left','right','a','b'].forEach(k=>setup('b-'+k, k));
setInterval(()=>{if(state.inputs.b) state.inputs.bHold++;}, 20);

state.player = new Player();
generateLevel();
update();
</script>
</body>
</html>
