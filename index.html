<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pixel Hero Saga: GitHub Edition</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #000; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; user-select: none; }
        
        #game-wrapper { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; background: #111; }
        canvas { background: #4facfe; width: 100%; height: auto; max-height: 75vh; image-rendering: pixelated; display: block; margin: 0 auto; }

        @media (orientation: landscape) {
            canvas { max-height: 100vh; width: auto; aspect-ratio: 16 / 9; }
            .controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; background: transparent !important; pointer-events: none; }
            .d-pad, .btns { pointer-events: auto; }
            .d-pad { position: absolute; bottom: 15%; left: 8%; }
            .btns { position: absolute; bottom: 15%; right: 8%; }
        }

        .controls { flex-grow: 1; background: #222; display: flex; justify-content: space-between; align-items: center; padding: 20px; z-index: 10; }
        .d-pad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 8px; }
        .btns { position: relative; width: 160px; height: 130px; }
        .btn { 
            background: #444; border: 4px solid #111; color: white; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; font-weight: bold; 
            box-shadow: 0 5px #000; transition: 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: none; background: #666; }
        
        /* FC配置: B(左下), A(右上) */
        #b-b { position: absolute; left: 0; bottom: 0; width: 75px; height: 75px; border-radius: 50%; background: #e91e63; font-size: 26px; }
        #b-a { position: absolute; right: 0; top: 0; width: 75px; height: 75px; border-radius: 50%; background: #4caf50; font-size: 26px; }
        .btn-dir { width: 60px; height: 60px; font-size: 24px; background: #333; }

        #ui-layer { position: absolute; top: 15px; left: 15px; color: white; text-shadow: 2px 2px #000; pointer-events: none; }
        .boss-ui { position: absolute; top: 15px; right: 15px; width: 150px; display: none; text-align: right; color: white; }
        .hp-bar { width: 100%; height: 12px; border: 2px solid #fff; background: #000; margin-top: 5px; }
        .hp-fill { width: 100%; height: 100%; background: #f00; transition: 0.2s; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
        <div id="hp-display" style="font-size: 24px;">❤❤❤</div>
        <div id="stage-display">STAGE 1-1</div>
        <div id="coin-display">COINS: 00</div>
    </div>
    <div class="boss-ui" id="boss-ui">
        DRAGON LORD
        <div class="hp-bar"><div id="boss-hp-fill" class="hp-fill"></div></div>
    </div>

    <div class="controls">
        <div class="d-pad">
            <div></div><div class="btn btn-dir" id="b-up">▲</div><div></div>
            <div class="btn btn-dir" id="b-left">◀</div><div></div><div class="btn btn-dir" id="b-right">▶</div>
            <div></div><div class="btn btn-dir" id="b-down">▼</div><div></div>
        </div>
        <div class="btns">
            <div class="btn" id="b-b">B</div>
            <div class="btn" id="b-a">A</div>
        </div>
    </div>
</div>

<script>
/** @type {HTMLCanvasElement} */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 480; 
canvas.height = 270;

// --- 定数 & グローバル状態 ---
const TILE_SIZE = 16;
const GRAVITY = 0.3;
const WORLD_WIDTH = 150; // タイル単位

let state = {
    stage: 1, section: 1,
    cameraX: 0, shake: 0, hitStop: 0,
    coins: 0,
    player: null,
    entities: [], particles: [], tiles: [],
    inputs: { left: false, right: false, up: false, down: false, a: false, b: false, bHold: 0 },
    boss: null
};

// --- ヘルパー: パーティクル ---
class Particle {
    constructor(x, y, color, vx, vy, life) {
        Object.assign(this, {x, y, color, vx, vy, life, maxLife: life});
    }
    update() { this.x += this.vx; this.y += this.vy; this.life--; }
    draw() {
        ctx.save();
        ctx.globalAlpha = this.life / this.maxLife;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x - state.cameraX, this.y, 2, 2);
        ctx.restore();
    }
}

function spawnEffect(x, y, color, count=5) {
    for(let i=0; i<count; i++) 
        state.particles.push(new Particle(x, y, color, (Math.random()-0.5)*4, (Math.random()-0.5)*4, 20));
}

// --- プレイヤークラス ---
class Player {
    constructor() {
        this.w = 14; this.h = 20;
        this.hp = 3;
        this.reset();
    }
    reset() {
        this.x = 40; this.y = 100; this.vx = 0; this.vy = 0;
        this.facing = 1; this.onGround = false;
        this.isCrouching = false; this.hipDrop = false;
        this.invincible = 0; this.anim = 0;
    }
    update() {
        if (this.invincible > 0) this.invincible--;

        // 移動ロジック
        let isDashing = state.inputs.b && (state.inputs.left || state.inputs.right);
        let moveSpeed = isDashing ? 3.5 : 2.2;

        if (state.inputs.left) { this.vx = -moveSpeed; this.facing = -1; }
        else if (state.inputs.right) { this.vx = moveSpeed; this.facing = 1; }
        else { this.vx *= 0.8; }

        // ジャンプ
        if (state.inputs.a && this.onGround) {
            this.vy = -6.5;
            this.onGround = false;
        }

        // しゃがみ & ヒップドロップ
        this.isCrouching = state.inputs.down && this.onGround;
        if (state.inputs.down && !this.onGround) {
            this.hipDrop = true;
            this.vy = 8;
        }
        if (this.onGround) this.hipDrop = false;

        // 物理演算
        this.vy += GRAVITY;
        this.x += this.vx; this.collide('x');
        this.y += this.vy; this.collide('y');

        // 穴に落ちた
        if (this.y > canvas.height + 50) this.damage(true);

        // カメラ追従
        let targetCam = this.x - canvas.width/2;
        state.cameraX += (targetCam - state.cameraX) * 0.12;
        state.cameraX = Math.max(0, state.cameraX);
        
        // クリア判定
        if (this.x > (WORLD_WIDTH * TILE_SIZE) - 20) nextSection();
    }
    collide(axis) {
        state.tiles.forEach(t => {
            if (this.x < t.x + t.w && this.x + this.w > t.x && this.y < t.y + t.h && this.y + this.h > t.y) {
                if (t.type === 'coin') { state.coins++; t.removed = true; return; }
                if (axis === 'x') { this.x -= this.vx; this.vx = 0; }
                else {
                    if (this.vy > 0) { 
                        this.y = t.y - this.h; this.vy = 0; this.onGround = true; 
                        if (this.hipDrop) { state.shake = 10; spawnEffect(this.x+7, this.y+20, "#fff", 10); }
                    } else { this.y = t.y + t.h; this.vy = 0; }
                }
            }
        });
        state.tiles = state.tiles.filter(t => !t.removed);
    }
    damage(instant = false) {
        if (this.invincible > 0 && !instant) return;
        this.hp--;
        state.shake = 20;
        state.hitStop = 10;
        this.invincible = 60;
        this.vy = -5; this.vx = -this.facing * 4;
        if (this.hp <= 0 || instant) {
            alert("GAME OVER - RETRY?");
            location.reload();
        }
    }
    draw() {
        ctx.save();
        if (this.invincible % 4 > 2) ctx.globalAlpha = 0.4;
        ctx.translate(this.x - state.cameraX, this.y);
        
        this.anim += Math.abs(this.vx) * 0.15;
        let walkY = (this.onGround && !this.isCrouching) ? Math.abs(Math.sin(this.anim))*3 : 0;

        // 頭
        ctx.fillStyle = "#ffdbac";
        ctx.fillRect(1, this.isCrouching ? 8 : 0 - walkY, 12, 10);
        // 服
        ctx.fillStyle = "#f44";
        ctx.fillRect(1, this.isCrouching ? 14 : 10, 12, 10);
        // 目
        ctx.fillStyle = "#000";
        ctx.fillRect(this.facing === 1 ? 9 : 2, this.isCrouching ? 12 : 4 - walkY, 2, 2);
        ctx.restore();
    }
}

// --- 敵・飛び道具 ---
class Enemy {
    constructor(type, x, y) {
        Object.assign(this, {type, x, y, w: 16, h: 16, vx: -1.2, hp: type==='boss'?40:1, t:0});
        if (type === 'boss') { this.w = 48; this.h = 48; this.vx = 0; }
        if (type === 'dragon') this.hp = 5;
    }
    update() {
        this.t++;
        if (this.type === 'mouse') {
            this.x += this.vx;
            state.tiles.forEach(t => { if (this.x < t.x+t.w && this.x+this.w > t.x && this.y < t.y+t.h && this.y+this.h > t.y) this.vx *= -1; });
        } else if (this.type === 'bat') {
            this.x += this.vx; this.y += Math.sin(this.t * 0.08) * 1.5;
        } else if (this.type === 'dragon' || this.type === 'boss') {
            this.y += Math.sin(this.t * 0.05) * 1.2;
            if (this.t % 120 === 0) spawnBullet(this.x, this.y + this.h/2, -2.5, "#ff0");
        }

        let p = state.player;
        if (p.x < this.x + this.w && p.x + p.w > this.x && p.y < this.y + this.h && p.y + p.h > this.y) {
            if (p.vy > 0 && p.y < this.y || p.hipDrop) {
                this.hp--; p.vy = -6; state.hitStop = 5; state.shake = 5;
                spawnEffect(this.x+this.w/2, this.y, "#f00");
                if (this.hp <= 0) this.dead = true;
            } else { p.damage(); }
        }
    }
    draw() {
        ctx.fillStyle = this.type === 'mouse' ? '#888' : (this.type === 'bat' ? '#606' : '#080');
        if (this.type === 'boss') ctx.fillStyle = '#050';
        ctx.fillRect(this.x - state.cameraX, this.y, this.w, this.h);
        ctx.fillStyle = "#fff"; ctx.fillRect(this.x - state.cameraX + 2, this.y + 2, 4, 4);
    }
}

class Bullet {
    constructor(x, y, vx, color) { Object.assign(this, {x, y, vx, color, w:10, h:10, life:120}); }
    update() {
        this.x += this.vx; this.life--;
        // 敵へのヒット
        state.entities.forEach(e => {
            if (e instanceof Enemy && this.x < e.x+e.w && this.x+this.w > e.x && this.y < e.y+e.h && this.y+this.h > e.y) {
                if (this.color === "#0ff") { e.hp--; this.dead = true; state.hitStop = 3; }
            }
        });
        // プレイヤーへのヒット
        let p = state.player;
        if (this.color === "#ff0" && this.x < p.x+p.w && this.x+this.w > p.x && this.y < p.y+p.h && this.y+p.h > p.y) {
            p.damage(); this.dead = true;
        }
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x - state.cameraX + 5, this.y + 5, 5, 0, 7); ctx.fill();
    }
}

function spawnBullet(x, y, vx, color) { state.entities.push(new Bullet(x, y, vx, color)); }

// --- システム ---
function generateLevel() {
    state.tiles = []; state.entities = []; state.particles = [];
    state.cameraX = 0;
    
    // 基本の地面
    for(let i=0; i<WORLD_WIDTH; i++) {
        if (i > 15 && i % 12 === 0 && Math.random() > 0.3) continue; // 穴を作る
        state.tiles.push({x: i*TILE_SIZE, y: 240, w: TILE_SIZE, h: 30, type: 'block'});
        
        // 足場とコイン
        if (i % 8 === 0) {
            state.tiles.push({x: i*TILE_SIZE, y: 170, w: 32, h: 8, type: 'block'});
            state.tiles.push({x: i*TILE_SIZE + 8, y: 150, w: 8, h: 8, type: 'coin'});
        }
        
        // 敵の配置
        if (i > 20 && i % 18 === 0) {
            let et = (state.stage < 2) ? 'mouse' : (state.stage < 4 ? 'bat' : 'dragon');
            state.entities.push(new Enemy(et, i*TILE_SIZE, 180));
        }
    }
    
    if (state.stage === 5 && state.section === 5) {
        state.boss = new Enemy('boss', 600, 100);
        state.entities.push(state.boss);
        document.getElementById('boss-ui').style.display = 'block';
    } else {
        document.getElementById('boss-ui').style.display = 'none';
    }
    state.player.reset();
}

function nextSection() {
    state.section++;
    if (state.section > 5) { state.section = 1; state.stage++; }
    if (state.stage > 5) { alert("ALL STAGES CLEARED!"); location.reload(); }
    generateLevel();
}

function mainLoop() {
    if (state.hitStop > 0) { state.hitStop--; requestAnimationFrame(mainLoop); return; }

    ctx.save();
    if (state.shake > 0) {
        ctx.translate((Math.random()-0.5)*state.shake, (Math.random()-0.5)*state.shake);
        state.shake *= 0.8;
    }

    // パララックス背景
    ctx.fillStyle = "#4facfe"; ctx.fillRect(0, 0, canvas.width, canvas.height); // 空
    ctx.fillStyle = "#00f2fe"; // 遠景の山
    for(let i=0; i<5; i++) ctx.fillRect((i*300) - (state.cameraX*0.2 % 300), 100, 150, 200);
    ctx.fillStyle = "#74ebd5"; // 中景の丘
    for(let i=0; i<6; i++) ctx.fillRect((i*200) - (state.cameraX*0.5 % 200), 180, 120, 100);

    // アップデート
    state.player.update();
    state.entities.forEach((e, i) => {
        e.update(); e.draw();
        if (e.dead || (e instanceof Bullet && e.life < 0)) state.entities.splice(i, 1);
        if (e === state.boss && e.dead) { alert("VICTORY!"); nextSection(); }
    });
    state.particles.forEach((p, i) => { p.update(); p.draw(); if (p.life < 0) state.particles.splice(i, 1); });
    
    // 描画
    state.tiles.forEach(t => { 
        ctx.fillStyle = t.type === 'block' ? '#388e3c' : '#ffd700';
        ctx.fillRect(t.x - state.cameraX, t.y, t.w, t.h); 
    });
    state.player.draw();
    ctx.restore();

    // UI
    document.getElementById('hp-display').innerText = "❤".repeat(state.player.hp);
    document.getElementById('stage-display').innerText = `STAGE ${state.stage}-${state.section}`;
    document.getElementById('coin-display').innerText = `COINS: ${state.coins}`;
    if (state.boss) document.getElementById('boss-hp-fill').style.width = (state.boss.hp/40*100) + "%";

    requestAnimationFrame(mainLoop);
}

// --- コントローラー ---
const setupBtn = (id, key) => {
    const el = document.getElementById(id);
    const press = (e) => { e.preventDefault(); state.inputs[key] = true; };
    const release = (e) => { 
        e.preventDefault(); 
        if (key === 'b' && state.inputs.bHold < 15) {
            spawnBullet(state.player.x+10, state.player.y+5, state.player.facing*6, "#0ff");
            state.player.vx -= state.player.facing * 2; // 反動
        }
        state.inputs[key] = false; state.inputs.bHold = 0;
    };
    el.addEventListener('touchstart', press); el.addEventListener('touchend', release);
    el.addEventListener('mousedown', press); el.addEventListener('mouseup', release);
};
['up','down','left','right','a','b'].forEach(k => setupBtn('b-'+k, k));
setInterval(() => { if (state.inputs.b) state.inputs.bHold++; }, 20);

// 起動
state.player = new Player();
generateLevel();
mainLoop();
</script>
</body>
</html>
