<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Hero Saga - Full Version</title>
    <style>
        body { margin: 0; background: #000; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; user-select: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        canvas { background: #5c94fc; width: 100%; max-width: 800px; image-rendering: pixelated; border-bottom: 4px solid #333; }
        
        .controls { width: 100%; max-width: 800px; height: 200px; background: #222; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; box-sizing: border-box; }
        .d-pad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 5px; }
        .btns { display: flex; gap: 20px; }
        .btn { background: #444; border: 3px solid #eee; color: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .btn:active { background: #888; transform: scale(0.95); }
        .btn-dir { width: 50px; height: 50px; }
        .btn-action { width: 70px; height: 70px; border-radius: 50%; font-size: 24px; }
        
        #ui { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 2px 2px #000; pointer-events: none; width: 95%; }
        #boss-ui { position: absolute; top: 10px; right: 10px; width: 150px; display: none; }
        .hp-bar { width: 100%; height: 12px; border: 2px solid #fff; background: #000; }
        .hp-fill { width: 100%; height: 100%; background: #f00; transition: width 0.3s; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div id="info">STAGE 1-1 | COINS: 0</div>
        <div id="hp">HP: ❤❤❤</div>
        <div id="boss-ui">
            BOSS HP
            <div class="hp-bar"><div id="boss-hp-fill" class="hp-fill"></div></div>
        </div>
    </div>

    <div class="controls">
        <div class="d-pad">
            <div></div><div class="btn btn-dir" id="b-up">▲</div><div></div>
            <div class="btn btn-dir" id="b-left">◀</div><div></div><div class="btn btn-dir" id="b-right">▶</div>
            <div></div><div class="btn btn-dir" id="b-down">▼</div><div></div>
        </div>
        <div class="btns">
            <div class="btn btn-action" id="b-b" style="background: #e91e63;">B</div>
            <div class="btn btn-action" id="b-a" style="background: #4caf50;">A</div>
        </div>
    </div>
</div>

<script>
/** @type {HTMLCanvasElement} */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 解像度をあえて低くしてドット感を強調
canvas.width = 480; 
canvas.height = 270;

// --- 設定値 ---
const TILE_SIZE = 16;
const GRAVITY = 0.25;

let state = {
    stage: 1, section: 1,
    cameraX: 0,
    coins: 0,
    player: null,
    entities: [], particles: [], tiles: [],
    inputs: { left: false, right: false, up: false, down: false, a: false, b: false, bTime: 0 },
    boss: null
};

// --- パーティクルシステム ---
class Particle {
    constructor(x, y, color, vx, vy, life) {
        this.x = x; this.y = y; this.color = color;
        this.vx = vx; this.vy = vy; this.life = life;
    }
    update() {
        this.x += this.vx; this.y += this.vy; this.life--;
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.life / 20;
        ctx.fillRect(this.x - state.cameraX, this.y, 3, 3);
        ctx.globalAlpha = 1;
    }
}

function spawnDust(x, y, color="#fff") {
    for(let i=0; i<3; i++) 
        state.particles.push(new Particle(x, y, color, (Math.random()-0.5)*2, -Math.random()*1, 20));
}

// --- エンティティクラス ---
class Player {
    constructor() {
        this.x = 50; this.y = 100; this.w = 14; this.h = 20;
        this.vx = 0; this.vy = 0;
        this.hp = 3; this.facing = 1;
        this.onGround = false;
        this.isCrouching = false;
        this.isDashing = false;
        this.hipDrop = false;
        this.animFrame = 0;
        this.invincible = 0;
    }

    update() {
        if (this.invincible > 0) this.invincible--;
        
        // 入力処理
        this.isDashing = state.inputs.b && (state.inputs.left || state.inputs.right);
        let speed = this.isDashing ? 3.0 : 1.8;
        
        if (state.inputs.left) { this.vx = -speed; this.facing = -1; }
        else if (state.inputs.right) { this.vx = speed; this.facing = 1; }
        else { this.vx *= 0.8; }

        if (this.isDashing && this.onGround && Math.random() < 0.2) spawnDust(this.x+7, this.y+20, "#ddd");

        // ジャンプ
        if (state.inputs.a && this.onGround) {
            this.vy = -5.5;
            this.onGround = false;
        }

        // しゃがみ & ヒップドロップ
        this.isCrouching = state.inputs.down && this.onGround;
        if (state.inputs.down && !this.onGround) {
            this.hipDrop = true;
            this.vy = 6;
        }
        if (this.onGround) this.hipDrop = false;

        this.vy += GRAVITY;
        this.x += this.vx;
        this.collision('x');
        this.y += this.vy;
        this.collision('y');

        // カメラ更新
        let targetCam = this.x - canvas.width/2;
        state.cameraX += (targetCam - state.cameraX) * 0.1;
        if (state.cameraX < 0) state.cameraX = 0;

        // クリア判定
        if (this.x > (state.mapW * TILE_SIZE) - 20) nextSection();
        if (this.y > canvas.height + 50) this.damage();
    }

    collision(axis) {
        state.tiles.forEach(t => {
            if (this.x < t.x + t.w && this.x + this.w > t.x && this.y < t.y + t.h && this.y + this.h > t.y) {
                if (t.type === 'coin') {
                    state.coins++; t.removed = true; return;
                }
                if (axis === 'x') {
                    this.x -= this.vx; this.vx = 0;
                } else {
                    if (this.vy > 0) {
                        this.y = t.y - this.h; this.vy = 0; this.onGround = true;
                        if (this.hipDrop) spawnDust(this.x+7, this.y+20, "#fff");
                    } else {
                        this.y = t.y + t.h; this.vy = 0;
                    }
                }
            }
        });
        state.tiles = state.tiles.filter(t => !t.removed);
    }

    damage() {
        if (this.invincible > 0) return;
        this.hp--;
        this.invincible = 60;
        this.vy = -4;
        if (this.hp <= 0) { alert("GAME OVER"); location.reload(); }
    }

    draw() {
        this.animFrame += Math.abs(this.vx) * 0.1;
        let bounce = Math.sin(this.animFrame) * 2;
        ctx.save();
        if (this.invincible % 4 > 2) ctx.globalAlpha = 0.4;
        ctx.translate(this.x - state.cameraX, this.y);
        
        // 2頭身人型
        ctx.fillStyle = "#ffdbac"; // 肌
        ctx.fillRect(1, this.isCrouching ? 8 : 0 + bounce, 12, 10); 
        ctx.fillStyle = "#333"; // 髪
        ctx.fillRect(1, this.isCrouching ? 8 : 0 + bounce, 12, 3);
        ctx.fillStyle = "#f44"; // 服
        ctx.fillRect(1, this.isCrouching ? 14 : 10, 12, 10);
        
        // 目
        ctx.fillStyle = "#000";
        let ex = this.facing === 1 ? 9 : 2;
        ctx.fillRect(ex, this.isCrouching ? 12 : 4 + bounce, 2, 2);
        ctx.restore();
    }
}

class Beam {
    constructor(x, y, f) {
        this.x = x; this.y = y; this.vx = f * 5; this.life = 60;
    }
    update() {
        this.x += this.vx; this.life--;
        spawnDust(this.x, this.y+4, "#0ff");
    }
    draw() {
        ctx.fillStyle = "#0ff";
        ctx.beginPath();
        ctx.arc(this.x - state.cameraX, this.y + 4, 6, 0, Math.PI*2);
        ctx.fill();
    }
}

class Enemy {
    constructor(type, x, y) {
        this.type = type; // bat, mouse, dragon
        this.x = x; this.y = y; this.w = 16; this.h = 16;
        this.vx = -1; this.hp = (type==='dragon') ? 5 : 1;
        if (type === 'boss') { this.hp = 30; this.w = 48; this.h = 48; }
        this.t = 0;
    }
    update() {
        this.t++;
        if (this.type === 'mouse') {
            this.x += this.vx;
            state.tiles.forEach(t => {
                if (this.x < t.x + t.w && this.x + this.w > t.x && this.y < t.y + t.h && this.y + this.h > t.y) this.vx *= -1;
            });
        } else if (this.type === 'bat') {
            this.x += this.vx;
            this.y += Math.sin(this.t * 0.1) * 1.5;
            if (Math.abs(state.player.x - this.x) < 50) this.y += 1; // 接近で降下
        } else if (this.type === 'dragon' || this.type === 'boss') {
            this.y += Math.sin(this.t * 0.05) * 1;
            if (this.t % 120 === 0) {
                state.entities.push(new Beam(this.x, this.y, -1)); // 火を吐く
            }
        }

        // プレイヤー攻撃判定
        let p = state.player;
        if (p.x < this.x + this.w && p.x + p.w > this.x && p.y < this.y + this.h && p.y + p.h > this.y) {
            if (p.vy > 0 && p.y < this.y || p.hipDrop) {
                this.hp--; p.vy = -4; spawnDust(this.x, this.y, "#f00");
                if (this.hp <= 0) this.dead = true;
            } else {
                p.damage();
            }
        }
    }
    draw() {
        ctx.fillStyle = this.type === 'mouse' ? '#888' : (this.type === 'bat' ? '#404' : '#0a0');
        if (this.type === 'boss') ctx.fillStyle = '#060';
        ctx.fillRect(this.x - state.cameraX, this.y, this.w, this.h);
        ctx.fillStyle = "#fff";
        ctx.fillRect(this.x - state.cameraX + 2, this.y + 4, 4, 4); // 目
    }
}

// --- ステージ生成システム ---
function initLevel() {
    state.tiles = []; state.entities = []; state.particles = [];
    state.cameraX = 0;
    
    // シンプルなマップ生成ロジック
    const map = [];
    state.mapW = 100; // 100タイル分の長さ
    for(let y=0; y<17; y++) {
        map[y] = [];
        for(let x=0; x<state.mapW; x++) {
            let char = '.';
            if (y === 15) char = '#'; // 地面
            if (x > 5 && Math.random() < 0.1 && y === 11) char = '#'; // 空中足場
            if (x > 10 && Math.random() < 0.05 && y === 10) char = 'C'; // コイン
            if (x === state.mapW - 1) char = 'G'; // ゴール
            map[y][x] = char;
        }
    }

    // マップ解析
    for(let y=0; y<17; y++) {
        for(let x=0; x<state.mapW; x++) {
            let tx = x * TILE_SIZE, ty = y * TILE_SIZE;
            if (map[y][x] === '#') state.tiles.push({x:tx, y:ty, w:TILE_SIZE, h:TILE_SIZE, type:'block'});
            if (map[y][x] === 'C') state.tiles.push({x:tx, y:ty, w:8, h:8, type:'coin'});
        }
    }

    // 敵配置
    if (state.stage === 5 && state.section === 5) {
        state.boss = new Enemy('boss', 400, 100);
        state.entities.push(state.boss);
        document.getElementById('boss-ui').style.display = 'block';
    } else {
        document.getElementById('boss-ui').style.display = 'none';
        for(let i=0; i<10; i++) {
            let et = (state.stage < 3) ? 'mouse' : (state.stage < 5 ? 'bat' : 'dragon');
            state.entities.push(new Enemy(et, 300 + i * 150, 100));
        }
    }

    state.player.x = 50; state.player.y = 100;
    document.getElementById('info').innerText = `STAGE ${state.stage}-${state.section} | COINS: ${state.coins}`;
}

function nextSection() {
    state.section++;
    if (state.section > 5) { state.section = 1; state.stage++; }
    if (state.stage > 5) { alert("ALL CLEAR! YOU ARE THE HERO!"); location.reload(); }
    initLevel();
}

// --- メインループ ---
function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 背景（遠景）
    ctx.fillStyle = "#4facfe";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    state.player.update();
    state.player.draw();

    state.tiles.forEach(t => {
        ctx.fillStyle = t.type === 'block' ? (state.stage === 2 ? '#444' : '#8bc34a') : '#ffd700';
        ctx.fillRect(t.x - state.cameraX, t.y, t.w, t.h);
    });

    state.entities.forEach((e, i) => {
        e.update();
        e.draw();
        if (e instanceof Beam && e.life <= 0) state.entities.splice(i, 1);
        if (e.dead) {
            if (e === state.boss) { alert("龍を倒した！"); nextSection(); }
            state.entities.splice(i, 1);
        }
    });

    state.particles.forEach((p, i) => {
        p.update(); p.draw();
        if (p.life <= 0) state.particles.splice(i, 1);
    });

    // UI
    document.getElementById('hp').innerText = "HP: " + "❤".repeat(state.player.hp);
    document.getElementById('info').innerText = `STAGE ${state.stage}-${state.section} | COINS: ${state.coins}`;
    if (state.boss) document.getElementById('boss-hp-fill').style.width = (state.boss.hp / 30 * 100) + "%";

    requestAnimationFrame(update);
}

// --- 入力制御 ---
const setupBtn = (id, key) => {
    const el = document.getElementById(id);
    const press = (e) => { 
        e.preventDefault(); 
        state.inputs[key] = true; 
    };
    const release = (e) => { 
        e.preventDefault(); 
        if (key === 'b' && state.inputs.bTime < 15) {
            // かめはめ波
            state.entities.push(new Beam(state.player.x + 8, state.player.y + 4, state.player.facing));
            state.player.vx -= state.player.facing * 3; // 反動
        }
        state.inputs[key] = false; 
        state.inputs.bTime = 0;
    };
    el.addEventListener('touchstart', press); el.addEventListener('touchend', release);
    el.addEventListener('mousedown', press); el.addEventListener('mouseup', release);
};

setupBtn('b-left', 'left'); setupBtn('b-right', 'right');
setupBtn('b-up', 'up'); setupBtn('b-down', 'down');
setupBtn('b-a', 'a'); setupBtn('b-b', 'b');

setInterval(() => { if (state.inputs.b) state.inputs.bTime++; }, 20);

// 開始
state.player = new Player();
initLevel();
update();

</script>
</body>
</html>
