<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pixel Hero Saga: Final Tuned</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #000; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; user-select: none; width: 100vw; height: 100vh; }
        
        #game-wrapper { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; background: #111; }
        
        canvas { 
            background: #4facfe; 
            width: 100%; 
            height: auto; 
            max-height: 60vh; /* 縦画面でCanvasが場所を取りすぎないように調整 */
            image-rendering: pixelated; 
            display: block; 
            margin: 0 auto; 
        }

        /* --- コントローラー層 --- */
        .controls { 
            position: relative;
            width: 100%;
            flex-grow: 1;
            background: #222;
            z-index: 100;
            /* 下部の埋まり防止：SafeArea分を底上げ */
            padding-bottom: env(safe-area-inset-bottom);
        }

        .d-pad, .btns { 
            position: absolute;
            pointer-events: auto;
        }

        /* --- 横画面（Landscape）時の配置 --- */
        @media (orientation: landscape) {
            canvas { max-height: 100vh; width: auto; aspect-ratio: 16 / 9; }
            .controls { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: transparent !important; pointer-events: none; }
            .d-pad { bottom: calc(15% + env(safe-area-inset-bottom)); left: calc(8% + env(safe-area-inset-left)); }
            .btns { bottom: calc(15% + env(safe-area-inset-bottom)); right: calc(8% + env(safe-area-inset-right)); width: 160px; height: 150px; }
        }

        /* --- 縦画面（Portrait）時の配置修正 --- */
        @media (orientation: portrait) {
            .d-pad { bottom: 60px; left: 10px; } /* 底上げ */
            .btns { bottom: 60px; right: 10px; width: 150px; height: 150px; } /* 底上げ */
        }

        .d-pad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 5px; }
        .btn { 
            background: #444; border: 4px solid #111; color: white; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; font-weight: bold; 
            box-shadow: 0 5px #000;
        }
        .btn:active { transform: translateY(4px); box-shadow: none; background: #666; }
        .btn-dir { width: 60px; height: 60px; font-size: 24px; background: #333; }

        /* --- Aボタン（上側：かめはめ波） --- */
        #b-a { 
            position: absolute; 
            right: 10px; top: 0; 
            width: 80px; height: 80px; 
            border-radius: 50%; 
            background: #4caf50; 
            font-size: 28px; 
        }

        /* --- Bボタン（下側：ジャンプ & ダッシュ） --- */
        #b-b { 
            position: absolute; 
            left: 0; bottom: 0; 
            width: 90px; height: 90px; /* ジャンプは重要なので少し大きく */
            border-radius: 50%; 
            background: #e91e63; 
            font-size: 28px; 
        }

        #ui-layer { 
            position: fixed; 
            top: calc(10px + env(safe-area-inset-top)); 
            left: calc(15px + env(safe-area-inset-left)); 
            color: white; text-shadow: 2px 2px #000; pointer-events: none; z-index: 110; 
        }
        #hp-display { font-size: 24px; color: #ff5252; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="hp-display">❤❤❤</div>
        <div id="stage-display" style="font-size: 14px;">STAGE 1-1</div>
        <div id="coin-display" style="font-size: 14px;">COINS: 00</div>
    </div>

    <div class="controls">
        <div class="d-pad">
            <div></div><div class="btn btn-dir" id="b-up">▲</div><div></div>
            <div class="btn btn-dir" id="b-left">◀</div><div></div><div class="btn btn-dir" id="b-right">▶</div>
            <div></div><div class="btn btn-dir" id="b-down">▼</div><div></div>
        </div>
        <div class="btns">
            <div class="btn" id="b-a">A</div> <div class="btn" id="b-b">B</div> </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 480; canvas.height = 270;

const TILE_SIZE = 16;
const GRAVITY = 0.22;
const JUMP_FORCE = -7.5;
const WORLD_WIDTH = 150;

let state = {
    stage: 1, section: 1, cameraX: 0, coins: 0,
    player: null, entities: [], tiles: [],
    inputs: { left: false, right: false, up: false, down: false, a: false, b: false, bHold: 0, aHold: 0 }
};

class Player {
    constructor() { this.w = 14; this.h = 20; this.hp = 3; this.reset(); }
    reset() { this.x = 40; this.y = 100; this.vx = 0; this.vy = 0; this.facing = 1; this.onGround = false; this.isCrouching = false; this.hipDrop = false; this.invincible = 0; }
    update() {
        if (this.invincible > 0) this.invincible--;
        
        // Bボタン（下側）でダッシュ
        let speed = state.inputs.b ? 3.8 : 2.5;
        
        if (state.inputs.left) { this.vx = -speed; this.facing = -1; } 
        else if (state.inputs.right) { this.vx = speed; this.facing = 1; } 
        else { this.vx *= 0.85; }

        // Bボタン（下側）でジャンプ
        if (state.inputs.b && this.onGround) {
            this.vy = JUMP_FORCE;
            this.onGround = false;
        }

        this.isCrouching = state.inputs.down && this.onGround;
        if (state.inputs.down && !this.onGround) { this.hipDrop = true; this.vy = 8; }
        if (this.onGround) this.hipDrop = false;

        this.vy += GRAVITY; this.x += this.vx; this.collide('x'); this.y += this.vy; this.collide('y');
        
        if (this.y > canvas.height + 50) this.damage(true);
        state.cameraX += (this.x - canvas.width/2 - state.cameraX) * 0.12;
        state.cameraX = Math.max(0, state.cameraX);
        if (this.x > (WORLD_WIDTH * TILE_SIZE) - 20) nextSection();
    }
    collide(axis) {
        state.tiles.forEach(t => {
            if (this.x < t.x + t.w && this.x + this.w > t.x && this.y < t.y + t.h && this.y + this.h > t.y) {
                if (t.type === 'coin') { state.coins++; t.removed = true; return; }
                if (axis === 'x') { this.x -= this.vx; this.vx = 0; }
                else { if (this.vy > 0) { this.y = t.y - this.h; this.vy = 0; this.onGround = true; } else { this.y = t.y + t.h; this.vy = 0; } }
            }
        });
        state.tiles = state.tiles.filter(t => !t.removed);
    }
    damage(instant = false) {
        if (this.invincible > 0 && !instant) return;
        this.hp--; this.invincible = 60; this.vy = -4;
        if (this.hp <= 0 || instant) { alert("RETRY?"); location.reload(); }
    }
    draw() {
        ctx.save(); if (this.invincible % 4 > 2) ctx.globalAlpha = 0.4;
        ctx.translate(this.x - state.cameraX, this.y);
        ctx.fillStyle = "#ffdbac"; ctx.fillRect(1, this.isCrouching ? 8 : 0, 12, 10);
        ctx.fillStyle = "#f44"; ctx.fillRect(1, this.isCrouching ? 14 : 10, 12, 10);
        ctx.fillStyle = "#000"; ctx.fillRect(this.facing === 1 ? 9 : 2, this.isCrouching ? 12 : 4, 2, 2);
        ctx.restore();
    }
}

class Bullet {
    constructor(x, y, vx) { Object.assign(this, {x, y, vx, w:10, h:10, life:100}); }
    update() { this.x += this.vx; this.life--; }
    draw() { ctx.fillStyle = '#0ff'; ctx.beginPath(); ctx.arc(this.x-state.cameraX+5, this.y+5, 5, 0, 7); ctx.fill(); }
}

function generateLevel() {
    state.tiles = []; state.entities = []; state.cameraX = 0;
    for(let i=0; i<WORLD_WIDTH; i++) {
        if (i > 15 && i % 14 === 0 && Math.random() > 0.4) continue;
        state.tiles.push({x: i*TILE_SIZE, y: 220, w: TILE_SIZE, h: 50, type: 'block'});
        if (i % 7 === 0) state.tiles.push({x: i*TILE_SIZE, y: 155, w: 32, h: 8, type: 'block'});
    }
    state.player.reset();
}

function nextSection() { state.section++; if (state.section > 5) { state.section = 1; state.stage++; } if (state.stage > 5) { alert("ALL CLEAR!"); location.reload(); } generateLevel(); }

function mainLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#4facfe"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    state.player.update();
    state.entities.forEach((e, i) => { e.update(); e.draw(); if (e.life < 0) state.entities.splice(i, 1); });
    state.tiles.forEach(t => { ctx.fillStyle = t.type === 'block' ? '#388e3c' : '#ffd700'; ctx.fillRect(t.x - state.cameraX, t.y, t.w, t.h); });
    state.player.draw();
    document.getElementById('hp-display').innerText = "❤".repeat(state.player.hp);
    document.getElementById('stage-display').innerText = `STAGE ${state.stage}-${state.section}`;
    requestAnimationFrame(mainLoop);
}

const setupBtn = (id, key) => {
    const el = document.getElementById(id);
    const start = (e) => { e.preventDefault(); state.inputs[key] = true; };
    const end = (e) => { 
        e.preventDefault(); 
        // Aボタン（上側）でかめはめ波
        if (key === 'a' && state.inputs.aHold < 15) {
            state.entities.push(new Bullet(state.player.x+10, state.player.y+5, state.player.facing*6));
        }
        state.inputs[key] = false; state.inputs.bHold = 0; state.inputs.aHold = 0;
    };
    el.addEventListener('touchstart', start); el.addEventListener('touchend', end);
    el.addEventListener('mousedown', start); el.addEventListener('mouseup', end);
};
['up','down','left','right','a','b'].forEach(k => setupBtn('b-'+k, k));
setInterval(() => { 
    if (state.inputs.b) state.inputs.bHold++; 
    if (state.inputs.a) state.inputs.aHold++;
}, 20);

state.player = new Player();
generateLevel();
mainLoop();
</script>
</body>
</html>
