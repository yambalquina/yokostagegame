<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Hero Adventure</title>
    <style>
        body { margin: 0; background: #222; font-family: 'Courier New', Courier, monospace; overflow: hidden; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; }
        canvas { background: #5c94fc; width: 100%; max-width: 800px; height: auto; border-bottom: 4px solid #000; image-rendering: pixelated; }
        
        /* コントローラー設定 */
        .controls { width: 100%; max-width: 800px; flex-grow: 1; position: relative; background: #333; display: grid; grid-template-columns: 1fr 1fr; }
        .d-pad { position: relative; display: grid; grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px 60px; gap: 5px; padding: 20px; align-self: center; justify-self: center; }
        .btn-action { position: relative; display: flex; gap: 20px; padding: 20px; align-self: center; justify-self: center; }
        
        .btn { background: #555; border: 4px solid #000; color: white; display: flex; align-items: center; justify-content: center; user-select: none; border-radius: 10px; font-weight: bold; }
        .btn:active { background: #888; }
        .btn-dir { width: 60px; height: 60px; }
        .btn-round { width: 70px; height: 70px; border-radius: 50%; font-size: 24px; }
        
        #ui-overlay { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 2px 2px #000; pointer-events: none; }
        .boss-hp-bar { position: absolute; top: 10px; right: 10px; width: 150px; height: 20px; border: 2px solid #fff; display: none; }
        #boss-hp-inner { width: 100%; height: 100%; background: red; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-overlay">
        <div id="stage-text">Stage 1-1</div>
        <div id="hp-text">HP: 3</div>
    </div>
    <div class="boss-hp-bar" id="boss-bar"><div id="boss-hp-inner"></div></div>
    
    <canvas id="gameCanvas"></canvas>

    <div class="controls">
        <div class="d-pad">
            <div></div><div class="btn btn-dir" id="btn-up">▲</div><div></div>
            <div class="btn btn-dir" id="btn-left">◀</div><div></div><div class="btn btn-dir" id="btn-right">▶</div>
            <div></div><div class="btn btn-dir" id="btn-down">▼</div><div></div>
        </div>
        <div class="btn-action">
            <div class="btn btn-round" id="btn-b" style="background: #e91e63;">B</div>
            <div class="btn btn-round" id="btn-a" style="background: #4caf50;">A</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 400; // 低解像度にしてドット感を出す
canvas.height = 240;

// ゲーム状態
let state = {
    stage: 1, section: 1,
    player: null,
    platforms: [], enemies: [], particles: [], projectiles: [],
    input: { left: false, right: false, up: false, down: false, a: false, b: false, bTimer: 0 },
    isGameOver: false,
    boss: null
};

// --- エンティティクラス ---

class Player {
    constructor() {
        this.reset();
    }
    reset() {
        this.x = 50; this.y = 150; this.w = 16; this.h = 24;
        this.vx = 0; this.vy = 0;
        this.onGround = false;
        this.hp = 3;
        this.isCrouching = false;
        this.isDashing = false;
        this.facing = 1; // 1: right, -1: left
        this.hipDrop = false;
        this.invincible = 0;
    }
    update() {
        if (this.invincible > 0) this.invincible--;

        // ダッシュ判定 (Bボタン)
        this.isDashing = state.input.b && (state.input.left || state.input.right);
        let speed = this.isDashing ? 3.5 : 2;

        // 移動
        if (state.input.left) { this.vx = -speed; this.facing = -1; }
        else if (state.input.right) { this.vx = speed; this.facing = 1; }
        else { this.vx *= 0.8; }

        // しゃがみ・ヒップドロップ
        this.isCrouching = state.input.down && this.onGround;
        if (state.input.down && !this.onGround) {
            this.hipDrop = true;
            this.vy = 8;
        }
        if (this.onGround) this.hipDrop = false;

        // ジャンプ
        if (state.input.a && this.onGround) {
            this.vy = -6.5;
            this.onGround = false;
        }

        this.vy += 0.3; // 重力
        this.x += this.vx;
        this.checkCollision('x');
        this.y += this.vy;
        this.checkCollision('y');

        if (this.y > canvas.height) this.takeDamage();
        if (this.x > canvas.width - 10) nextSection();
    }
    takeDamage() {
        if (this.invincible > 0) return;
        this.hp--;
        this.invincible = 60;
        if (this.hp <= 0) {
            alert("Game Over...");
            location.reload();
        } else {
            this.x = 50; this.y = 100;
        }
    }
    checkCollision(axis) {
        state.platforms.forEach(p => {
            if (this.x < p.x + p.w && this.x + this.w > p.x &&
                this.y < p.y + p.h && this.y + this.h > p.y) {
                if (axis === 'x') {
                    this.x -= this.vx; this.vx = 0;
                } else {
                    if (this.vy > 0) {
                        this.y = p.y - this.h; this.vy = 0; this.onGround = true;
                    } else {
                        this.y = p.y + p.h; this.vy = 0;
                    }
                }
            }
        });
    }
    draw() {
        ctx.save();
        if (this.invincible % 4 > 2) ctx.globalAlpha = 0.5;
        // 2頭身キャラ描画
        let drawY = this.isCrouching ? this.y + 8 : this.y;
        let drawH = this.isCrouching ? 16 : 24;
        
        ctx.fillStyle = "#ffccaa"; // 肌
        ctx.fillRect(this.x + 2, drawY, 12, 12); // 頭
        ctx.fillStyle = "#333"; // 髪
        ctx.fillRect(this.x + 2, drawY, 12, 4);
        ctx.fillStyle = "#f00"; // 服
        ctx.fillRect(this.x + 2, drawY + 12, 12, drawH - 12);
        
        // 目
        ctx.fillStyle = "#000";
        let eyeX = this.facing === 1 ? this.x + 10 : this.x + 4;
        ctx.fillRect(eyeX, drawY + 5, 2, 2);
        ctx.restore();
    }
}

class Projectile {
    constructor(x, y, dir) {
        this.x = x; this.y = y; this.vx = dir * 6; this.w = 12; this.h = 12;
    }
    update() { this.x += this.vx; }
    draw() {
        ctx.fillStyle = "#0ff";
        ctx.beginPath();
        ctx.arc(this.x, this.y + 8, 6, 0, Math.PI*2);
        ctx.fill();
    }
}

class Enemy {
    constructor(type, x, y) {
        this.type = type; // 'bat', 'mouse', 'dragon'
        this.x = x; this.y = y; this.vx = -1; this.w = 16; this.h = 16;
        this.hp = type === 'dragon' ? 5 : 1;
        this.timer = 0;
    }
    update() {
        this.timer++;
        if (this.type === 'mouse') {
            this.x += this.vx;
            if (this.x < 0 || this.x > canvas.width - 20) this.vx *= -1;
        } else if (this.type === 'bat') {
            this.x += this.vx;
            this.y += Math.sin(this.timer * 0.1) * 1;
            if (this.x < 0 || this.x > canvas.width - 20) this.vx *= -1;
        } else if (this.type === 'dragon') {
            this.w = 32; this.h = 32;
            this.y += Math.sin(this.timer * 0.05) * 0.5;
            if (this.timer % 100 === 0) {
                // ボス攻撃
                state.projectiles.push(new Projectile(this.x, this.y + 8, -0.5));
            }
        }
    }
    draw() {
        if (this.type === 'mouse') ctx.fillStyle = '#888';
        else if (this.type === 'bat') ctx.fillStyle = '#606';
        else ctx.fillStyle = '#0a0';
        ctx.fillRect(this.x, this.y, this.w, this.h);
        // 顔（簡易）
        ctx.fillStyle = '#fff';
        ctx.fillRect(this.x + 2, this.y + 4, 3, 3);
    }
}

// --- システム関数 ---

function nextSection() {
    state.section++;
    if (state.section > 5) {
        state.section = 1;
        state.stage++;
    }
    if (state.stage > 5) {
        alert("おめでとう！世界に平和が戻った！");
        location.reload();
    }
    initLevel();
}

function initLevel() {
    state.platforms = [{x: 0, y: 200, w: 500, h: 40}];
    state.enemies = [];
    state.projectiles = [];
    
    // セクションに応じた敵配置
    if (state.stage === 5 && state.section === 5) {
        // ラスボス
        state.boss = new Enemy('dragon', 300, 100);
        state.boss.hp = 20;
        state.enemies.push(state.boss);
        document.getElementById('boss-bar').style.display = 'block';
    } else {
        document.getElementById('boss-bar').style.display = 'none';
        let enemyType = state.stage % 3 === 0 ? 'dragon' : (state.stage % 2 === 0 ? 'bat' : 'mouse');
        state.enemies.push(new Enemy(enemyType, 200, 180));
        state.enemies.push(new Enemy(enemyType, 350, 150));
    }
    
    document.getElementById('stage-text').innerText = `Stage ${state.stage}-${state.section}`;
    state.player.x = 20;
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    state.player.update();
    state.player.draw();

    // 敵の処理
    state.enemies.forEach((e, i) => {
        e.update();
        e.draw();
        
        // プレイヤーとの衝突
        if (state.player.x < e.x + e.w && state.player.x + state.player.w > e.x &&
            state.player.y < e.y + e.h && state.player.y + state.player.h > e.y) {
            
            if (state.player.vy > 0 && state.player.y + 10 < e.y || state.player.hipDrop) {
                // 踏んだ or ヒップドロップ
                e.hp--;
                state.player.vy = -4;
                if (e.hp <= 0) {
                    state.enemies.splice(i, 1);
                    if (e === state.boss) alert("龍を倒した！");
                }
            } else {
                state.player.takeDamage();
            }
        }
    });

    // 飛び道具の処理
    state.projectiles.forEach((p, i) => {
        p.update();
        p.draw();
        // 敵へのヒット判定
        state.enemies.forEach((e, ei) => {
            if (p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
                e.hp--;
                state.projectiles.splice(i, 1);
                if (e.hp <= 0) state.enemies.splice(ei, 1);
            }
        });
        if (p.x > canvas.width || p.x < 0) state.projectiles.splice(i, 1);
    });

    // 地面描画
    ctx.fillStyle = '#4e342e';
    state.platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
    
    // UI更新
    document.getElementById('hp-text').innerText = `HP: ${state.player.hp}`;
    if (state.boss) {
        document.getElementById('boss-hp-inner').style.width = (state.boss.hp / 20 * 100) + '%';
    }

    requestAnimationFrame(gameLoop);
}

// --- 入力イベント ---

const setupButton = (id, key) => {
    const btn = document.getElementById(id);
    const start = (e) => { e.preventDefault(); state.input[key] = true; };
    const end = (e) => { 
        e.preventDefault(); 
        if (key === 'b') {
            // 短押しなら「かめはめ波」
            if (state.input.bTimer < 15) {
                state.projectiles.push(new Projectile(state.player.x + 8, state.player.y + 4, state.player.facing));
            }
            state.input.bTimer = 0;
        }
        state.input[key] = false; 
    };
    btn.addEventListener('touchstart', start);
    btn.addEventListener('touchend', end);
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', end);
};

setupButton('btn-left', 'left');
setupButton('btn-right', 'right');
setupButton('btn-up', 'up');
setupButton('btn-down', 'down');
setupButton('btn-a', 'a');
setupButton('btn-b', 'b');

// Bボタンタイマー（長押しダッシュ用）
setInterval(() => {
    if (state.input.b) state.input.bTimer++;
}, 20);

// 開始
state.player = new Player();
initLevel();
gameLoop();

</script>
</body>
</html>
